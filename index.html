<script>/* Shared story schema, validation and sample. No credentials or student data. */
var StoryModel = (function () {
  'use strict';
  function copy(x) { return JSON.parse(JSON.stringify(x)); }
  function validate(entities) {
    var alive = entities.filter(function (e) { return !e.deleted; });
    var nodes = alive.filter(function (e) { return e.type === 'node'; });
    var roles = alive.filter(function (e) { return e.type === 'role'; });
    var sources = alive.filter(function (e) { return e.type === 'source'; });
    var byId = {}, errors = [], warnings = [], reached = {};
    alive.forEach(function (e) { byId[e.id] = e; });
    if (!roles.length) errors.push('至少要有一位可選角色。');
    if (!nodes.length) errors.push('還沒有故事情節。');
    var info = alive.find(function(e){return e.type==='info';});
    if (!info || !info.data.title || !info.data.intro) errors.push('請補上故事名稱與共同開場。');
    function targets(n) {
      return n.data.kind === 'choice' ? (n.data.options || []).map(function(o){return o.target;}) : n.data.kind === 'scene' ? [n.data.next] : [];
    }
    nodes.forEach(function(n){
      var d=n.data;
      if (!d.title || !d.text) errors.push('「'+(d.title||'未命名情節')+'」缺少標題或內容。');
      if (['scene','choice','ending'].indexOf(d.kind)<0) errors.push('情節類型不正確。');
      if (d.kind==='choice' && (!d.options || d.options.length<2 || d.options.length>4)) errors.push('「'+d.title+'」請設計 2 至 4 個選項。');
      if(d.kind==='choice') (d.options||[]).forEach(function(o){if(!o.label)errors.push('「'+d.title+'」有空白選項。');});
      targets(n).forEach(function(t){if(!t||!byId[t]||byId[t].type!=='node')errors.push('「'+d.title+'」有尚未接好的下一幕。');});
      (d.sourceIds||[]).forEach(function(id){var s=byId[id];if(!s||s.type!=='source'||!s.data.approved)errors.push('「'+d.title+'」引用的史料尚未由教師確認。');});
      if(d.imageId && (!byId[d.imageId] || byId[d.imageId].type!=='asset'))errors.push('「'+d.title+'」的圖片已刪除。');
    });
    roles.forEach(function(r){
      if(!r.data.name||!r.data.job||!r.data.background)errors.push('角色「'+(r.data.name||'未命名')+'」的身分資料未完成。');
      if(!byId[r.data.startNode]||byId[r.data.startNode].type!=='node')errors.push('角色「'+r.data.name+'」尚未指定起點。');
      if(r.data.imageId && (!byId[r.data.imageId] || byId[r.data.imageId].type!=='asset'))errors.push('角色「'+r.data.name+'」的圖片已刪除。');
    });
    // Fixed point: every reachable node must have a possible path to an ending.
    var canEnd={};nodes.filter(function(n){return n.data.kind==='ending';}).forEach(function(n){canEnd[n.id]=true;});
    var changed=true;
    while(changed){changed=false;nodes.forEach(function(n){if(!canEnd[n.id] && targets(n).some(function(t){return canEnd[t];})){canEnd[n.id]=true;changed=true;}});}
    function walk(id, seen){if(seen[id]||!byId[id]||byId[id].type!=='node')return;seen[id]=true;reached[id]=true;targets(byId[id]).forEach(function(t){walk(t,seen);});}
    roles.forEach(function(r){var seen={};walk(r.data.startNode,seen);Object.keys(seen).forEach(function(id){if(!canEnd[id])errors.push('從「'+r.data.name+'」可走到「'+byId[id].data.title+'」，但無法抵達結局。');});});
    nodes.forEach(function(n){if(!reached[n.id])warnings.push('「'+n.data.title+'」目前沒有角色會走到。');});
    if(!sources.some(function(s){return s.data.approved;}))warnings.push('尚未放入教師確認的歷史資料。');
    return {errors:Array.from(new Set(errors)),warnings:Array.from(new Set(warnings))};
  }
  function seed() {
    function e(id,type,data){return {id:id,type:type,data:data,rev:1,deleted:false};}
    var entities=[
      e('info','info',{title:'明早，春生要去哪裡？',intro:'新工場開始運轉。春生想學機器，家裡卻還有甘蔗沒砍完。選擇一個身分，走進這場交涉。',disclaimer:'本遊戲為學生創作的模擬故事，情節不代表歷史上實際發生過的事。'}),
      e('role-spring','role',{name:'陳春生',job:'製糖工人',background:'想進工場學機器，農忙時也會回家幫忙。阿泉是父親，文清是表哥。',want:'想學會一門技術。',worry:'怕錯過試做，也怕父親一個人做不完。',startNode:'spring-choice',imageId:''}),
      e('role-farmer','role',{name:'陳阿泉',job:'蔗農',background:'靠交蔗養家。春生是兒子，文清是外甥。',want:'收好的甘蔗順利交出去。',worry:'春生去工場後，田裡少一雙手。',startNode:'farmer-choice',imageId:''}),
      e('spring-choice','node',{kind:'choice',title:'明早兩邊都需要我',text:'主任說師傅明早能帶我試做。父親卻說，東邊的田還有一半沒砍。今晚得先給一個答覆。',response:'',options:[{id:'a',label:'先找父親談幫忙時間',target:'ask-neighbor'},{id:'b',label:'先問主任能否改試做時間',target:'ask-chief'}],sourceIds:[],imageId:''}),
      e('farmer-choice','node',{kind:'choice',title:'兒子想去工場',text:'春生把上工的消息告訴我。我希望他學技術，可是明早少一個人，甘蔗恐怕砍不完。',response:'',options:[{id:'a',label:'去問鄰居能否幫半天',target:'ask-neighbor'},{id:'b',label:'請春生先問工場能否改時間',target:'ask-chief'}],sourceIds:[],imageId:''}),
      e('ask-neighbor','node',{kind:'scene',title:'鄰居也在等車',text:'鄰居願意幫半天，但要先知道自己家的車何時到。文清翻開車班簿，還得確認另一戶的安排。',response:'鄰居沒有立刻答應整天幫忙，送蔗和人手得一起商量。',next:'end-help',sourceIds:[],imageId:''}),
      e('ask-chief','node',{kind:'scene',title:'師傅的另一個時段',text:'主任去問師傅。師傅說下午可以再帶一次，但原本要檢查機器的工作，得先找到人接手。',response:'主任請大家確認時間，春生也得重新安排家裡的工作。',next:'end-time',sourceIds:[],imageId:''}),
      e('end-help','node',{kind:'ending',title:'一起等一個確定的時間',text:'春生先去工場。阿泉和鄰居約好輪流幫忙，等文清確認車班，再把剩下的蔗搬到路口。學技術的機會留下了，兩家的工作也變得更依靠彼此。',response:'',sourceIds:[],imageId:''}),
      e('end-time','node',{kind:'ending',title:'重新排過的下午',text:'春生早上留在田裡，下午再去工場。主任找到人先做檢查，師傅才空出時間。大家暫時排好了，但下一次農忙，仍得提早說清楚。',response:'',sourceIds:[],imageId:''}),
      e('source-factory','source',{title:'橋仔頭糖廠資料',fact:'請從讀過的歷史線索卡選一段與本故事有關的史實，並核對原始資料。',url:'https://tcmb.culture.tw/zh-tw/detail?id=20201124000003&indexCode=BOCH_CountryCulture_11',approved:false}),
      e('material-example','material',{who:'春生',stage:'第一輪事件一',action:'跟家裡約好幫忙時間',reason:'想學機器，也想知道家裡哪一天最需要我。',prediction:'父親可能會請鄰居幫忙，但得先確認車班。',setting:'不喜歡答應了又失約。',sample:true})
    ];
    return entities;
  }
  function clean(type,d,isTeacher,old) {
    d=d||{}; var result={};
    var fields={info:['title','intro','disclaimer'],role:['name','job','background','want','worry','startNode','imageId'],node:['kind','title','text','response','next','imageId'],source:['title','fact','url'],material:['who','stage','action','reason','prediction','setting'],comment:['text','targetId']};
    if(!fields[type])throw new Error('無法儲存這種資料。');
    fields[type].forEach(function(k){result[k]=String(d[k]||'').slice(0,k==='text'?6000:2000);});
    if(type==='node'){
      if(['scene','choice','ending'].indexOf(result.kind)<0)throw new Error('請選擇情節類型。');
      result.options=(d.options||[]).slice(0,4).map(function(o,i){return{id:String(o.id||('option-'+i)).slice(0,100),label:String(o.label||'').slice(0,300),target:String(o.target||'').slice(0,120)};});
      result.sourceIds=(d.sourceIds||[]).slice(0,20).map(function(id){return String(id).slice(0,120);});
      result.originMaterialId=String(d.originMaterialId||'').slice(0,120);
    }
    if(type==='source'){
      if(result.url && !/^https:\/\//i.test(result.url))throw new Error('史料連結請使用 https 網址。');
      var same=old && old.title===result.title && old.fact===result.fact && old.url===result.url;
      result.approved=isTeacher ? !!d.approved : !!(same && old.approved);
      if(result.approved && (!result.title||!result.fact||!result.url))throw new Error('教師確認前，請補齊史實、標題和來源網址。');
    }
    return result;
  }
  function publicEntities(entities) {
    var usedImages={};entities.forEach(function(e){if(!e.deleted && ['role','node'].indexOf(e.type)>=0 && e.data.imageId)usedImages[e.data.imageId]=true;});
    return entities.filter(function(e){return !e.deleted && ['info','role','node','source','asset'].indexOf(e.type)>=0 && (e.type!=='source'||e.data.approved) && (e.type!=='asset'||usedImages[e.id]);}).map(function(e){var d=copy(e.data);if(e.type==='node')delete d.originMaterialId;return{id:e.id,type:e.type,data:d};});
  }
  return {copy:copy,validate:validate,seed:seed,clean:clean,publicEntities:publicEntities};
})();
if(typeof module!=='undefined')module.exports=StoryModel;
</script>
<script>
'use strict';
function safeStorage(key){let memory={};try{let store=window[key];store.setItem('__studio_probe__','1');store.removeItem('__studio_probe__');return store}catch(_){return {getItem:k=>memory[k]||null,setItem:(k,v)=>{memory[k]=String(v)},removeItem:k=>{delete memory[k]},key:i=>Object.keys(memory)[i]||null,get length(){return Object.keys(memory).length}}}}
const localStore=safeStorage('localStorage'),sessionStore=safeStorage('sessionStorage');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>('e-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2))),clone=StoryModel.copy;
const real=true,clientId=uid(),route={play:new URLSearchParams(location.search).get('play')||''};
let state={token:sessionStore.getItem('studio-token')||'',user:null,projects:[],pid:'',ws:null,tab:'info',edit:null,dirty:false,busy:false,lease:false,player:null,images:{},polling:false},toastTimer;
const tabs=[['info','01　故事開場'],['role','02　角色身分'],['material','03　議事素材'],['node','04　情節與選擇'],['map','05　故事地圖'],['source','06　歷史資料'],['asset','07　故事圖片'],['preview','08　玩家試玩'],['teacher','教師工作台']];
function toast(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',6500)}
function fail(e){toast(e.message||String(e))}
function raw(name,args){if(!window.studioTransport)return Promise.reject(Error('連線程式未載入，請老師確認 GitHub 上有 transport.js。'));return window.studioTransport.call(name,args)}
async function unwrap(name,args){let r=await raw(name,args);if(!r.ok){let e=Error(r.error.message);e.code=r.error.code;e.latest=r.error.latest;throw e}return r.data}
function api(action,v={}){return unwrap('studioApi',[state.token,action,Object.assign({projectId:state.pid},v)])}
const alive=(type)=>state.ws.entities.filter(e=>!e.deleted&&(!type||e.type===type));
function nameOf(e){return e.data.title||e.data.name||e.data.who||'未命名'}
function labelKind(k){return {scene:'情節',choice:'選擇',ending:'結局'}[k]||k}
function field(label,key,value,area=false,help=''){return `<label>${label}${area?`<textarea data-field="${key}">${esc(value)}</textarea>`:`<input data-field="${key}" value="${esc(value)}">`}</label>${help?`<small>${help}</small>`:''}`}
function selectField(label,key,value,items,blank='請選擇'){return `<label>${label}<select data-field="${key}"><option value="">${blank}</option>${items.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.label||nameOf(x))}</option>`).join('')}</select></label>`}
function openModal(html){$('#modal').innerHTML=`<div class="row between"><h2>查看與管理</h2><button data-act="closeModal">關閉</button></div>${html}`;$('#modal').showModal()}
function draftKey(id){return 'studio-draft:'+state.user.id+':'+state.pid+':'+id}
function writeDraft(){if(!state.edit)return;try{localStore.setItem(draftKey(state.edit.id),JSON.stringify({entity:state.edit,at:new Date().toISOString()}))}catch(e){toast('這個裝置無法保留草稿，請先儲存到作品。')}}
function readForm(){let e=state.edit;if(!e)return;let f=$('#edit-form');if(!f)return;f.querySelectorAll('[data-field]').forEach(el=>{e.data[el.dataset.field]=el.type==='checkbox'?el.checked:el.value});if(e.type==='node'){e.data.options=[...f.querySelectorAll('.option')].map(el=>({id:el.dataset.id,label:el.querySelector('[data-opt="label"]').value,target:el.querySelector('[data-opt="target"]').value}));e.data.sourceIds=[...f.querySelectorAll('[data-source]:checked')].map(el=>el.dataset.source)}state.dirty=true;writeDraft();let s=$('#save-state');if(s)s.textContent='尚未存到作品 · 已保留本機草稿'}
function beforeLeave(){if(!state.dirty)return true;writeDraft();return confirm('這份內容尚未儲存，已保留在本機草稿。要先離開嗎？')}
async function releaseEdit(){let e=state.edit;if(e&&e.type==='node'&&state.lease){try{await api('releaseLease',{entityId:e.id,clientId})}catch(_){}}state.lease=false;state.edit=null;state.dirty=false}
async function loadWorkspace(){state.ws=await api('workspace');state.projects=state.projects.map(p=>p.id===state.pid?Object.assign({},p,{title:state.ws.project.title,releaseId:state.ws.project.releaseId}):p);state.images={};return state.ws}
async function refresh(){await loadWorkspace();renderShell()}
function renderLogin(){state.user=null;$('#app').innerHTML=`<div class="hero"><div class="hero-head"><div class="eyebrow">SUGAR · PARALLEL STORIES</div><h1>同一座糖廠，<br>從你們的選擇長出不同故事。</h1><p>從議事庭留下的決定出發。添一個人物、改一段對話，把「如果當時……」寫成可以走進去的故事。</p><span class="tag">作者設計版</span> <span class="tag">玩家體驗版</span></div><form id="login-form" class="panel login"><h2>進入故事創作室</h2><p class="muted">輸入老師在試算表設定的姓名與密碼。</p><label>姓名<input id="login-name" autocomplete="username" required maxlength="80"></label><label>密碼<input id="login-password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="primary" style="width:100%;margin-top:18px" id="login-submit">登入</button><p id="login-error" role="alert" class="muted" style="margin-top:14px"></p></form><p class="muted">本遊戲為模擬互動體驗，故事情節不代表歷史上實際發生過的事。作品中的歷史資料會另外標示來源。</p></div>`}
async function login(name,password){let b=$('#login-submit');if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span>登入中'}try{let d=await unwrap('studioLogin',[name,password]);state.token=d.token;sessionStore.setItem('studio-token',d.token);state.user=d.user;state.projects=d.projects;state.pid=d.projects[0]?.id||'';if(state.pid)await loadWorkspace();renderShell()}catch(e){$('#login-error').textContent=e.message}finally{if(b){b.disabled=false;b.textContent='登入'}}}
function renderShell(){if(!state.user)return;let prev=state.tab==='preview';$('#app').innerHTML=`<header class="top"><div><div class="brand">糖的多重宇宙 <span style="font-size:14px;font-weight:400">／故事創作室</span></div><div class="muted">${esc(state.user.name)} · ${state.user.role==='teacher'?'教師':'故事作者'}</div></div><div class="row"><label class="sr-only" for="project-select">選擇作品</label><select id="project-select">${state.projects.map(p=>`<option value="${esc(p.id)}" ${p.id===state.pid?'selected':''}>${esc(p.title)}</option>`).join('')}</select><button data-act="logout" class="small">登出</button></div></header><div class="shell"><aside class="nav">${tabs.filter(t=>t[0]!=='teacher'||state.user.role==='teacher').map(t=>`<button data-act="tab" data-id="${t[0]}" class="${state.tab===t[0]?'active':''}">${t[1]}</button>`).join('')}<div class="nav-note divider"><small>一人編一幕，一起接故事。<br>其他人的修改約 12 秒後更新。<br>同一幕一次由一個頁面編輯。</small></div></aside><main id="main">${!state.ws?'<div class="panel"><h2>還沒有可編輯的作品</h2><p>請老師將你的帳號加入作品。</p>'+(state.user.role==='teacher'?'<button data-act="newProject" class="primary">建立作品</button>':'')+'</div>':''}</main></div>`;if(!state.ws)return;if(prev){startPlayer({entities:StoryModel.publicEntities(alive()),version:'草稿',projectId:state.pid},true);return}renderTab()}
function heading(title,description,extra=''){return `<div class="row between" style="margin-bottom:22px"><div><div class="eyebrow">STORY WORKSHOP</div><h1 style="margin:6px 0">${title}</h1><p class="muted" style="margin:0">${description}</p></div>${extra}</div>`}
function draftsMarkup(){let prefix='studio-draft:'+state.user.id+':'+state.pid+':',found=[];for(let i=0;i<localStore.length;i++){let k=localStore.key(i);if(k&&k.startsWith(prefix)){try{let d=JSON.parse(localStore.getItem(k));found.push(d.entity)}catch(_){}}}return found.length?'<div class="notice"><b>這個裝置有尚未送出的草稿</b><div class="toolbar">'+found.map(e=>`<button class="small" data-act="openDraft" data-id="${esc(e.id)}">接回：${esc(nameOf(e))}</button>`).join('')+'</div></div>':''}
function renderTab(){let main=$('#main');if(!main||!state.ws)return;let tab=state.tab;
 if(['info','role','node','source','material'].includes(tab)){let titles={info:['故事從哪裡開始？','先說清楚發生了什麼事，讓觀眾知道自己即將進入什麼世界。'],role:['觀眾可以成為誰？','延續議事庭的角色，補上這個故事真正會用到的經驗。'],node:['把「接下來」寫成一幕','先寫這一刻發生什麼事，再把選項接到下一幕。'],source:['故事裡哪些有歷史依據？','用自己的話寫下史實，再附上看過的資料。'],material:['從你們做過的決定開始','挑一份議事紀錄，想像這個決定之後，還有誰會受到影響。']};let list=alive(tab),create=tab!=='info'?`<button data-act="newEntity" data-id="${tab}" class="primary">＋ ${tab==='node'?'新增一幕':tab==='role'?'新增角色':tab==='source'?'新增史料':'新增素材'}</button>`:'';main.innerHTML=heading(...titles[tab],create)+draftsMarkup()+`<div class="split"><section class="list">${list.map(e=>`<button data-act="selectEntity" data-id="${esc(e.id)}" class="${state.edit?.id===e.id?'selected':''}">${e.type==='node'?`<span class="tag ${e.data.kind}">${labelKind(e.data.kind)}</span><br>`:''}${esc(nameOf(e))}${e.type==='source'?`<br><small>${e.data.approved?'教師已確認':'待核對'}</small>`:''}</button>`).join('')||'<p class="muted">還沒有內容，先新增一張卡。</p>'}</section><section id="editor">${state.edit?editorMarkup():'<div class="panel empty">選一張卡，開始編輯。<br>也可以先看示例，再改成自己的故事。</div>'}</section></div>`;if(state.edit)hydrateImages();return}
 if(tab==='map'){main.innerHTML=heading('看見故事怎麼分開，又在哪裡相遇','點一張情節卡就能修改。線上的文字是玩家可以選的行動。')+mapMarkup();return}
 if(tab==='asset'){main.innerHTML=heading('為故事加入畫面','可上傳 JPG、PNG、WebP；系統會先縮小圖片。請使用有權使用的圖片。')+`<div class="panel"><label>選擇圖片<input type="file" id="image-upload" accept="image/png,image/jpeg,image/webp"></label><p class="muted" id="upload-status">圖片不會自動公開；要等老師發布作品後，玩家才看得到。</p></div><div class="grid">${alive('asset').map(e=>`<div class="card"><img class="role-img" data-image="${esc(e.id)}" alt="${esc(e.data.name)}"><h3>${esc(e.data.name)}</h3><p class="muted">在角色或情節卡的「圖片」欄選取即可使用。</p></div>`).join('')}</div>`;hydrateImages();return}
 if(tab==='teacher')renderTeacher();
}
function editorMarkup(){let e=state.edit,d=e.data,type=e.type,nodes=alive('node'),assets=alive('asset'),body='';let draft=localStore.getItem(draftKey(e.id));
 if(type==='info')body=field('作品名稱','title',d.title)+field('共同開場','intro',d.intro,true,'交代地點、正在發生的事，以及觀眾需要面對的問題。')+field('故事說明','disclaimer',d.disclaimer,true);
 if(type==='role')body=field('角色姓名','name',d.name)+field('身分／職業','job',d.job)+field('背景與人物關係','background',d.background,true)+field('他希望什麼？','want',d.want)+field('他擔心什麼？','worry',d.worry)+selectField('從哪一幕開始？','startNode',d.startNode,nodes)+selectField('角色圖片','imageId',d.imageId,assets,'先不放圖片');
 if(type==='node')body=`${d.originMaterialId?`<div class="notice"><b>這一幕來自議事素材</b><p style="margin:6px 0">${esc(alive('material').find(x=>x.id===d.originMaterialId)?.data.reason||'原素材已移到回收區')}</p><small>沿用當時的理由，補上後來發生的事。</small></div>`:''}`+selectField('這一幕的類型','kind',d.kind,[{id:'scene',label:'情節：讀完接下一幕'},{id:'choice',label:'選擇：觀眾決定怎麼做'},{id:'ending',label:'結局：這條故事在這裡收束'}])+field('這一幕叫什麼？','title',d.title)+field('觀眾會看到的故事','text',d.text,true,'寫出人物的動作或對話，讓觀眾知道眼前發生什麼事。')+(d.kind==='choice'?`<label>觀眾可以怎麼做？</label><small>先設計兩個合理的做法；想讓第三條故事出現時再新增。</small>${(d.options||[]).map((o,i)=>`<div class="option" data-id="${esc(o.id)}"><label>選項 ${i+1}<input data-opt="label" value="${esc(o.label)}" placeholder="例如：先去問鄰居能不能幫半天"></label><label>選了以後到哪一幕？<select data-opt="target"><option value="">先留白，稍後接線</option>${nodes.map(n=>`<option value="${esc(n.id)}" ${o.target===n.id?'selected':''}>${esc(n.data.title)}</option>`).join('')}</select></label><button class="small danger" type="button" data-act="removeOption" data-id="${i}">移除這個選項</button></div>`).join('')}<button type="button" data-act="addOption" ${d.options?.length>=4?'disabled':''}>＋ 加一個選項</button>`:d.kind==='scene'?selectField('讀完以後到哪一幕？','next',d.next,nodes):'<div class="notice good">這是一個結局。說清楚誰的生活改變了，也可以留下尚未解決的事。</div>')+field('補充對話或後續反應（可留白）','response',d.response,true)+selectField('這一幕的圖片','imageId',d.imageId,assets,'先不放圖片')+`<label>引用哪些歷史資料？</label>${alive('source').map(s=>`<label class="check"><input type="checkbox" data-source="${esc(s.id)}" ${(d.sourceIds||[]).includes(s.id)?'checked':''}>${esc(s.data.title)} · ${s.data.approved?'教師已確認':'待核對'}</label>`).join('')||'<small>先到「歷史資料」新增史料卡。</small>'}`;
 if(type==='source')body=field('資料名稱','title',d.title)+field('從資料中確認的史實','fact',d.fact,true,'只寫資料真的有提到的內容。角色的心情與結局可以創作。')+field('原始資料網址','url',d.url)+(state.user.role==='teacher'?`<label class="check"><input type="checkbox" data-field="approved" ${d.approved?'checked':''}>我已核對原資料，確認這段史實可以使用。</label>`:`<div class="notice ${d.approved?'good':''}">${d.approved?'教師已確認。修改內容後，會重新等待核對。':'由教師核對後，才能用於發布作品。'}</div>`);
 if(type==='material')body=field('這是誰的決定？','who',d.who)+field('哪個事件／回合？','stage',d.stage)+field('當時怎麼選？','action',d.action)+field('當時的理由','reason',d.reason,true)+field('預想會發生什麼事？','prediction',d.prediction,true)+field('想保留的角色設定','setting',d.setting,true)+`<button type="button" data-act="materialToNode">用這份素材建立一幕</button>`;
 let lease=type==='node'?`<div class="notice ${state.lease?'good':''}">${state.lease?'這一幕目前由你編輯。':'目前無法儲存這一幕。可以閱讀、保留本機草稿，或重新取得編輯權。'} ${!state.lease?'<button type="button" class="small" data-act="acquire">重新取得編輯權</button>':''}</div>`:'';
 return `<form id="edit-form" class="panel">${lease}<div class="row between"><span class="tag">${{info:'共同開場',role:'角色卡',node:labelKind(d.kind),source:'歷史資料',material:'議事素材'}[type]}</span><small>${e.rev?'版本 '+e.rev:'尚未建立'}</small></div>${draft&&!state.dirty?'<div class="notice" style="margin-top:16px">這個裝置有未清除的草稿。<button class="small" type="button" data-act="recoverDraft">查看並接回草稿</button></div>':''}${body}<div class="toolbar sticky"><button type="submit" class="primary" id="save-button" ${state.busy||(type==='node'&&!state.lease)?'disabled':''}>${state.busy?'<span class="spinner"></span>儲存中':'儲存這張卡'}</button><span class="save-state" id="save-state">${state.dirty?'尚未存到作品 · 已保留本機草稿':'已載入作品內容'}</span>${e.rev?'<button type="button" class="small" data-act="history">修改紀錄</button>':''}${e.rev&&type!=='info'?'<button type="button" class="small danger" data-act="deleteEntity">移到回收區</button>':''}</div></form>${type==='node'&&e.rev?commentsMarkup(e.id):''}`;
}
function commentsMarkup(id){let comments=alive('comment').filter(c=>c.data.targetId===id);return `<div class="panel"><h3>一起討論這一幕</h3>${comments.map(c=>`<p><span class="tag">${esc(state.ws.users.find(u=>u.id===c.updatedBy)?.name||'故事作者')}</span> ${esc(c.data.text)}</p>`).join('')}<label>留言<textarea id="comment-text" placeholder="例如：如果阿泉先答應了，春生還會擔心什麼？"></textarea></label><button data-act="comment">留下建議</button></div>`}
async function selectEntity(id){if(!beforeLeave())return;await releaseEdit();let e=state.ws.entities.find(e=>e.id===id);if(!e||e.deleted)return;state.edit=clone(e);state.tab=e.type;if(e.type==='node')await acquire(false);renderShell()}
async function acquire(render=true){try{await api('lease',{entityId:state.edit.id,clientId});state.lease=true}catch(e){state.lease=false;toast(e.message)}if(render)renderTab()}
async function newEntity(type,custom){if(!beforeLeave())return;await releaseEdit();let data={info:{},role:{name:'',job:'',background:'',want:'',worry:'',startNode:'',imageId:''},node:{kind:'choice',title:'',text:'',response:'',next:'',options:[{id:uid(),label:'',target:''},{id:uid(),label:'',target:''}],sourceIds:[],imageId:''},source:{title:'',fact:'',url:'',approved:false},material:{who:'',stage:'',action:'',reason:'',prediction:'',setting:''}}[type];state.edit={id:uid(),type,data:Object.assign(data,custom||{}),rev:0,deleted:false};state.tab=type;state.dirty=true;writeDraft();if(type==='node')await acquire(false);renderShell()}
async function save(){if(state.busy||!state.edit)return;readForm();state.busy=true;let b=$('#save-button');if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span>儲存中'}$('#edit-form')?.querySelectorAll('input,textarea,select,button').forEach(el=>el.disabled=true);try{let e=state.edit,result=await api('save',{id:e.id,type:e.type,data:e.data,expectedRev:e.rev,clientId});localStore.removeItem(draftKey(e.id));state.edit=result;state.dirty=false;await loadWorkspace();toast('已儲存到作品。其他人很快就能看到。')}catch(e){writeDraft();if(e.code==='CONFLICT')showConflict(e);else toast(e.message)}finally{state.busy=false;if(state.ws&&state.tab!=='preview')renderShell()}}
function showConflict(e){openModal(`<div class="notice error">${esc(e.message)}</div><h3>目前作品中的版本</h3><pre class="history">${esc(JSON.stringify(e.latest?.data||{},null,2))}</pre><h3>你尚未送出的草稿</h3><pre class="history">${esc(JSON.stringify(state.edit.data,null,2))}</pre><p>草稿會留在本機。先載入新版本，將要保留的句子重新加入，再儲存。</p><button data-act="loadLatest" data-id="${esc(state.edit.id)}" class="primary">載入最新版本</button>`)}
function mapMarkup(){let nodes=alive('node'),roles=alive('role'),depth={},queue=roles.map(r=>[r.data.startNode,1]);while(queue.length){let [id,n]=queue.shift();if(depth[id]!==undefined||!nodes.some(x=>x.id===id))continue;depth[id]=n;let x=nodes.find(x=>x.id===id),targets=x.data.kind==='choice'?(x.data.options||[]).map(o=>o.target):x.data.kind==='scene'?[x.data.next]:[];targets.forEach(t=>queue.push([t,n+1]))}let orphan=Math.max(1,...Object.values(depth))+1;nodes.forEach(n=>{if(depth[n.id]===undefined)depth[n.id]=orphan});let all=[...roles.map(r=>({...r,depth:0})),...nodes.map(n=>({...n,depth:depth[n.id]}))],counts={},pos={};all.forEach(e=>{let col=e.depth,index=counts[col]||0;counts[col]=index+1;pos[e.id]={x:col*300+22,y:index*145+25}});let w=(Math.max(0,...all.map(x=>x.depth))+1)*300+15,h=Math.max(360,...Object.values(counts).map(n=>n*145+30));let lines='';all.forEach(e=>{let links=e.type==='role'?[{target:e.data.startNode,label:'角色起點'}]:e.data.kind==='choice'?(e.data.options||[]).map(o=>({target:o.target,label:o.label})):e.data.kind==='scene'?[{target:e.data.next,label:'下一幕'}]:[];links.forEach((l,i)=>{let a=pos[e.id],b=pos[l.target];if(!b)return;let x1=a.x+215,y1=a.y+42+i*10,x2=b.x,y2=b.y+42,back=x2<=x1,m=(x1+x2)/2;lines+=`<path d="M${x1} ${y1} C${back?x1+60:m} ${y1},${back?x2-35:m} ${y2},${x2} ${y2}" fill="none" stroke="#8ca898" stroke-width="2" marker-end="url(#arrow)"/><text x="${back?x1+4:x1+8}" y="${y1-8}" font-size="11" fill="#54685e">${esc(l.label.slice(0,9))}</text>`})});let check=StoryModel.validate(alive());return `<div class="row" style="margin-bottom:15px"><span class="tag">${roles.length} 個身分</span><span class="tag choice">${nodes.filter(n=>n.data.kind==='choice').length} 個選擇點</span><span class="tag ending">${nodes.filter(n=>n.data.kind==='ending').length} 個結局</span></div><div class="map-wrap"><div class="map-canvas" style="width:${w}px;height:${h}px"><svg width="${w}" height="${h}" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8ca898"/></marker></defs>${lines}</svg>${all.map(e=>`<button class="map-node" style="left:${pos[e.id].x}px;top:${pos[e.id].y}px" data-act="selectEntity" data-id="${esc(e.id)}"><span class="tag ${e.data.kind||''}">${e.type==='role'?'身分':labelKind(e.data.kind)}</span><b>${esc(nameOf(e))}</b><small>${e.type==='role'?esc(e.data.job):e.data.kind==='ending'?'故事在此收束':'點卡片修改'}</small></button>`).join('')}</div></div><div class="panel" style="margin-top:20px"><h3>故事檢查</h3>${check.errors.length?check.errors.map(e=>`<p style="color:var(--red)">• ${esc(e)}</p>`).join(''):'<p>每位角色都有起點，所有可到達的情節都能走向結局。</p>'}${check.warnings.map(e=>`<p class="muted">• ${esc(e)}</p>`).join('')}</div>`}

async function hydrateImages(){let els=[...document.querySelectorAll('[data-image]')];await Promise.allSettled(els.map(async img=>{let id=img.dataset.image;if(!id)return;try{let key=(state.player&&!state.player.preview?state.player.data.releaseId:'edit')+':'+id;if(!state.images[key])state.images[key]=state.player&&!state.player.preview?await unwrap('studioPublicImage',[state.player.data.projectId,state.player.data.releaseId,id]):await api('image',{assetId:id});if(img.isConnected)img.src=state.images[key]}catch(e){img.alt='圖片暫時無法讀取'}}))}
async function upload(file){if(!file)return;let status=$('#upload-status');status.textContent='正在縮小並上傳圖片……';$('#image-upload').disabled=true;try{if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error('請選 PNG、JPG 或 WebP。');if(file.size>15000000)throw Error('原始圖片請小於 15MB。');let dataUrl=await compressImage(file);await api('upload',{name:file.name,dataUrl});await refresh();toast('圖片已放進這個作品。')}catch(e){fail(e);if(status.isConnected)status.textContent=e.message}finally{if($('#image-upload'))$('#image-upload').disabled=false}}
function compressImage(file){return new Promise((resolve,reject)=>{let u=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{let c=document.createElement('canvas'),ratio=Math.min(1,1400/Math.max(im.width,im.height));c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);let cx=c.getContext('2d');cx.fillStyle='#ffffff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(im,0,0,c.width,c.height);let q=.85,url=c.toDataURL('image/jpeg',q);while(url.length>990000&&q>.35){q-=.1;url=c.toDataURL('image/jpeg',q)}if(url.length>1000000)throw Error('圖片細節太多，請改用較小的圖片。');resolve(url)}catch(e){reject(e)}finally{URL.revokeObjectURL(u)}};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error('圖片無法開啟。'))};im.src=u})}
